<title>Landing Page Template</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="site">
/* Layout: one column of full-width bands in a fixed sales order. Every colour, font and shape comes from the tokens below. */
:root {
  --c-accent: #2f5d50; --c-accent-text: #ffffff; --c-bg: #fbfaf7; --c-bg-alt: #f1efe9; --c-text: #1d1f1e;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-heading: Georgia, "Times New Roman", serif;
  --scale: 1; --h-scale: 1; --h-weight: 700; --h-case: none;
  --radius: 10px; --btn-radius: 10px; --space: 1; --max-width: 1040px;

  --accent: var(--c-accent); --accent-text: var(--c-accent-text);
  --bg: var(--c-bg); --bg-alt: var(--c-bg-alt); --text: var(--c-text);
  --muted: color-mix(in srgb, var(--c-text) 68%, var(--c-bg));
  --border: color-mix(in srgb, var(--c-text) 16%, var(--c-bg));
}
.on-accent {
  --bg: var(--c-accent); --text: var(--c-accent-text);
  --accent: var(--c-accent-text); --accent-text: var(--c-accent);
  --muted: color-mix(in srgb, var(--c-accent-text) 80%, var(--c-accent));
  --border: color-mix(in srgb, var(--c-accent-text) 30%, var(--c-accent));
  background: var(--bg); color: var(--text);
}
.on-photo {
  --bg: rgba(0, 0, 0, 0.4); --text: #ffffff; --muted: rgba(255, 255, 255, 0.85); --border: rgba(255, 255, 255, 0.35);
  color: var(--text); background-size: cover; background-position: center;
}
.on-photo .eyebrow, .on-photo .stats strong { color: #ffffff; }

*, *::before, *::after { box-sizing: border-box; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: calc(1.0625rem * var(--scale));
  line-height: 1.65;
}
h1, h2, h3 {
  font-family: var(--font-heading); font-weight: var(--h-weight); text-transform: var(--h-case);
  line-height: 1.15; margin: 0 0 1rem; text-wrap: balance;
}
h1 { font-size: calc(clamp(2.25rem, 6vw, 3.75rem) * var(--h-scale)); }
h2 { font-size: calc(clamp(1.75rem, 4vw, 2.5rem) * var(--h-scale)); }
h3 { font-size: calc(1.25rem * var(--h-scale)); }
p { margin: 0 0 1rem; }
a { color: var(--accent); }
img { max-width: 100%; display: block; }

.wrap {
  max-width: var(--max-width);
  margin: 0 auto;
  padding-left: max(1.25rem, env(safe-area-inset-left, 0px));
  padding-right: max(1.25rem, env(safe-area-inset-right, 0px));
}
.narrow { max-width: 720px; }
.center { text-align: center; }
.lefty > * { max-width: 46rem; }
.intro { max-width: 680px; }
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 3rem; align-items: center; }
.split > * { min-width: 0; }
.split .media { margin-top: 0; }

.site-header { background: var(--bg); border-bottom: 1px solid var(--border); padding: 0.9rem 0; }
.site-header .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; }
.logo { height: 2.25rem; width: auto; }
.brand { font-family: var(--font-heading); font-size: 1.25rem; font-weight: 700; color: var(--text); }

.section { padding: calc(clamp(3.5rem, 9vw, 6rem) * var(--space)) 0; }
.hero { padding: calc(clamp(4rem, 12vw, 8rem) * var(--space)) 0; }
.section-alt { background: var(--bg-alt); }
.lead { font-size: 1.2em; color: var(--muted); margin-bottom: 2rem; }
.button {
  display: inline-block;
  padding: 0.85rem 1.75rem;
  border: 2px solid var(--accent);
  border-radius: var(--btn-radius);
  background: var(--accent);
  color: var(--accent-text);
  font-size: 1.05em;
  font-weight: 600;
  text-decoration: none;
}
a.button:hover { opacity: 0.88; }
.note { color: var(--muted); font-size: 0.85em; margin: 0.75rem 0 0; }
.section-intro { color: var(--muted); }
.eyebrow {
  color: var(--accent);
  font-size: 0.8em;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 0.75rem;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(250px, 100%), 1fr));
  gap: 1.5rem;
  margin: 2.5rem 0 0;
}
.grid > * { min-width: 0; }
.card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin: 0; }

.list { list-style: none; margin: 1.5rem 0 0; padding: 0; }
.list li { position: relative; padding: 0.6rem 0 0.6rem 1.75rem; border-top: 1px solid var(--border); }
.list li::before {
  content: ""; position: absolute; left: 0.25rem; top: 1.15em;
  width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--accent);
}
.callout {
  margin: 2rem 0 0;
  padding: 0.25rem 0 0.25rem 1.25rem;
  border-left: 4px solid var(--accent);
  font-family: var(--font-heading);
  font-size: 1.3em;
  line-height: 1.35;
}

.feature { border-top: 2px solid var(--accent); padding-top: 1.25rem; }
.feature p, .steps p { color: var(--muted); margin: 0; }
.icon {
  display: block; width: 2.75rem; height: 2.75rem; padding: 0.6rem; margin-bottom: 1rem;
  border-radius: var(--radius); background: var(--accent); color: var(--accent-text);
}
.icon-img { width: 3.5rem; height: 3.5rem; object-fit: cover; border-radius: var(--radius); margin-bottom: 1rem; }
.media { width: 100%; max-width: 100%; border-radius: var(--radius); margin-top: 3rem; }

.steps { list-style: none; padding: 0; counter-reset: step; }
.steps li { counter-increment: step; }
.steps li::before {
  content: counter(step);
  display: grid; place-items: center;
  width: 2.5rem; height: 2.5rem; margin-bottom: 1rem;
  border-radius: 50%; background: var(--accent); color: var(--accent-text); font-weight: 700;
}

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 1.5rem; margin-top: 2.5rem; }
.stats strong { display: block; font-family: var(--font-heading); font-size: 2.4em; line-height: 1.1; color: var(--accent); }
.stats span, .who span { display: block; color: var(--muted); font-size: 0.9em; }
figure blockquote { margin: 0 0 1.25rem; }
figcaption { display: flex; align-items: center; gap: 0.75rem; }
.who { min-width: 0; }
.who strong { display: block; }
.avatar { width: 3rem; height: 3rem; border-radius: 50%; object-fit: cover; flex: none; }

.pricing { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 2.5rem; align-items: start; margin-top: 2.5rem; }
.pricing > * { min-width: 0; }
.price-card { border: 2px solid var(--accent); text-align: center; }
.price-card .list { text-align: left; margin-bottom: 1.5rem; }
.price-card .button { display: block; }
.price { font-family: var(--font-heading); font-size: 2.8em; line-height: 1.1; margin: 0; }
.price .per { font-family: var(--font-body); font-size: 1rem; color: var(--muted); margin-left: 0.35rem; }

.faq details, .faq-item { border-bottom: 1px solid var(--border); }
.faq details:first-child, .faq-item:first-child { border-top: 1px solid var(--border); }
.faq summary, .faq-q { cursor: pointer; padding: 1rem 0; font-weight: 600; margin: 0; }
.faq details p, .faq-a { color: var(--muted); }

.site-footer { border-top: 1px solid var(--border); padding: 2rem 0; color: var(--muted); font-size: 0.85em; text-align: center; }
.site-footer p { margin: 0; }
</style>
<style id="ed">
/* Editing tools only. None of this is included in the downloaded website. */
:root { --ed-bg: #20242b; --ed-fg: #f3f4f6; --ed-dim: #aeb4bf; --ed-line: #3b414c; --ed-go: #ffd166; --ed-go-text: #1c1a10;
        --ed-font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --ed-w: 320px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ed-bg); }
.ed-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--ed-bg); color: var(--ed-fg); font: 0.9rem/1.3 var(--ed-font); }
.ed-bar-in {
  padding-block: 0.6rem;
  padding-left: max(1.25rem, env(safe-area-inset-left, 0px));
  padding-right: max(1.25rem, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem;
}
.ed-status { color: var(--ed-dim); flex: 1 1 12rem; min-width: 0; }
.ed-link { display: flex; align-items: center; gap: 0.5rem; flex: 2 1 16rem; min-width: 0; color: var(--ed-dim); white-space: nowrap; }
.ed-link input {
  flex: 1; min-width: 0; padding: 0.45rem 0.6rem;
  border: 1px solid var(--ed-line); border-radius: 6px; background: transparent; color: var(--ed-fg); font: inherit;
}
.ed-link input::placeholder { color: var(--ed-dim); }
.ed-btn {
  padding: 0.5rem 0.9rem; border-radius: 6px; cursor: pointer; font: inherit; font-weight: 600;
  border: 1px solid var(--ed-line); background: transparent; color: var(--ed-fg);
}
.ed-btn.go { background: var(--ed-go); border-color: var(--ed-go); color: var(--ed-go-text); }
.ed-btn[aria-expanded="true"] { background: var(--ed-fg); color: var(--ed-bg); }
.ed-btn:disabled { opacity: 0.5; cursor: default; }
.ed-hint { margin: 0; padding: 0.6rem 0; background: var(--bg-alt); border-bottom: 1px solid var(--border); color: var(--muted); font: 0.875rem/1.5 var(--ed-font); }

/* Design panel */
.ed-panel {
  position: fixed; right: 0; bottom: 0; top: 3.5rem; z-index: 8; width: var(--ed-w); overflow-y: auto;
  background: var(--ed-bg); color: var(--ed-fg); border-left: 1px solid var(--ed-line); font: 0.85rem/1.4 var(--ed-font);
  padding: 1rem max(1rem, env(safe-area-inset-right, 0px)) calc(1.5rem + env(safe-area-inset-bottom, 0px)) 1rem;
  display: flex; flex-direction: column; gap: 0.6rem;
}
.ed-h { margin: 0.9rem 0 0; font-weight: 700; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ed-dim); }
.ed-h:first-child { margin-top: 0; }
.ed-f { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
.ed-f select, .ed-f input[type="range"] { flex: 0 1 9.5rem; min-width: 0; }
.ed-f select { padding: 0.35rem 0.4rem; border: 1px solid var(--ed-line); border-radius: 6px; background: var(--ed-bg); color: var(--ed-fg); font: inherit; }
.ed-f input[type="color"] { width: 2.75rem; height: 2rem; padding: 0; border: 1px solid var(--ed-line); border-radius: 6px; background: none; cursor: pointer; }
.ed-pals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; }
.ed-pal { height: 2.25rem; padding: 0; border: 1px solid var(--ed-line); border-radius: 6px; cursor: pointer; overflow: hidden; display: flex; background: none; }
.ed-pal i { flex: 1; }
.ed-note { margin: 0.5rem 0 0; color: var(--ed-dim); }
@media (min-width: 1000px) { body.ed-open #app, body.ed-open .ed-hint { margin-right: var(--ed-w); } }
@media (max-width: 999px) {
  .ed-panel { top: auto !important; left: 0; width: auto; max-height: 46vh; border-left: 0; border-top: 1px solid var(--ed-line);
              padding-left: max(1rem, env(safe-area-inset-left, 0px)); }
  body.ed-open #app { padding-bottom: 46vh; }
}

/* Editable text */
[data-k] { outline: 1px dashed transparent; outline-offset: 4px; border-radius: 2px; min-width: 3ch; cursor: text; }
span[data-k] { display: inline-block; }
.stats span[data-k], .who span[data-k] { display: block; }
[data-k]:hover { outline-color: var(--border); }
[data-k]:focus { outline: 2px solid var(--accent); }
[data-k]:empty::before { content: attr(data-ph); opacity: 0.5; font-style: italic; text-transform: none; }
.button[data-k] { cursor: text; }

/* Per-section controls */
.ed-sec {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.6rem;
  font: 0.8rem/1.2 var(--ed-font); color: var(--muted); text-align: left;
  padding-bottom: 0.75rem; margin-bottom: 1.75rem; border-bottom: 1px dashed var(--border);
}
.ed-sec b { color: var(--text); margin-right: auto; }
.ed-sec select, .ed-sec button, .ed-mini {
  font: 0.8rem/1.2 var(--ed-font); color: inherit; background: transparent;
  border: 1px solid var(--border); border-radius: 5px; padding: 0.3rem 0.5rem; cursor: pointer;
}
.ed-sec option { color: #111111; background: #ffffff; }
.ed-sec button:hover, .ed-mini:hover { color: var(--text); border-color: var(--text); }
.ed-hidden { padding: 1rem 0 0.25rem; background: var(--bg); border-top: 1px dashed var(--border); }
.ed-hidden .ed-sec { border-bottom: 0; margin-bottom: 0; }
.ed-mini { color: var(--muted); }

/* Repeatable items */
[data-item] { position: relative; }
.ed-x {
  position: absolute; top: 0.35rem; right: 0.35rem;
  width: 1.75rem; height: 1.75rem; padding: 0; border-radius: 50%;
  border: 1px solid var(--border); background: var(--bg); color: var(--muted);
  font: 1rem/1 var(--ed-font); cursor: pointer; opacity: 0.55;
}
.ed-x:hover, .ed-x:focus-visible { opacity: 1; color: var(--text); }
.list li[data-item], .faq-item { padding-right: 2.5rem; }
.ed-add {
  display: inline-block; margin-top: 1rem; padding: 0.4rem 0.8rem;
  border: 1px dashed var(--muted); border-radius: 6px;
  background: transparent; color: var(--muted); font: 0.85rem var(--ed-font); cursor: pointer;
}
.ed-add:hover { color: var(--text); border-color: var(--text); }
.ed-imgbtn { padding: 0; border: 0; background: none; cursor: pointer; flex: none; }

/* Icon picker */
.ed-pop { position: relative; margin-bottom: 1rem; width: max-content; max-width: 100%; }
.ed-pop summary { list-style: none; cursor: pointer; width: max-content; }
.ed-pop summary::-webkit-details-marker { display: none; }
.ed-pop summary .icon, .ed-pop summary .icon-img { margin-bottom: 0; }
.ed-pop-in {
  position: absolute; z-index: 5; top: calc(100% + 0.4rem); left: 0; width: 15.5rem; max-width: 80vw;
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.3rem; padding: 0.6rem;
  background: var(--ed-bg); border: 1px solid var(--ed-line); border-radius: 8px; color: var(--ed-fg);
}
.ed-pop-in button {
  display: grid; place-items: center; aspect-ratio: 1; padding: 0.3rem; cursor: pointer;
  border: 1px solid transparent; border-radius: 5px; background: none; color: inherit; font: 0.8rem var(--ed-font);
}
.ed-pop-in button:hover { border-color: var(--ed-dim); }
.ed-pop-in button.wide { grid-column: span 3; aspect-ratio: auto; border-color: var(--ed-line); padding: 0.4rem; }
.ed-pop-in svg { width: 1.4rem; height: 1.4rem; }

.ed-file { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
.ed-bar :focus-visible, .ed-panel :focus-visible, .ed-pop-in :focus-visible { outline: 2px solid var(--ed-go); outline-offset: 2px; }
.ed-add:focus-visible, .ed-sec :focus-visible, .ed-mini:focus-visible, .ed-pop summary:focus-visible, .ed-imgbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>

    '<p class="ed-hint"><span class="wrap" style="display:block">Click any text and type. Faded italic text is a prompt: it disappears when you type, and anything left empty is left out of the finished site. Open Design for colours, fonts and shapes.</span></p>' +
    '<div id="app"></div>' +
    '<input type="file" accept="image/*" class="ed-file" id="ed-file" tabindex="-1" aria-hidden="true">';
  var app = $("app"), statusEl = $("ed-status"), saveBtn = $("ed-save"), urlIn = $("ed-url");
  var panel = $("ed-panel"), designBtn = $("ed-design"), fileIn = $("ed-file");
  var art = null, canSave = false, imgPath = "";

  function draw() { app.innerHTML = page(true); }
  function syncPanel() {
    panel.querySelectorAll("[data-d]").forEach(function (el) { el.value = S.d[el.dataset.d]; });
    urlIn.value = S.f.url || "";
  }
  function refresh() { applyDesign(); syncPanel(); draw(); status(notice); }
  function status(msg) {
    statusEl.textContent = msg || (dirty
      ? (canSave ? "Unsaved changes" : "Changes are kept in this browser only")
      : (canSave ? "All changes saved" : "Click any text to edit"));
    saveBtn.disabled = !dirty;
  }
  var timer;
  function changed() {
    dirty = true; notice = "";
    status();
    clearTimeout(timer);
    timer = setTimeout(keep, 300);
  }
  function keep() { if (dirty) kv.set(DRAFT, { base: baseRev, s: S }); }
  window.addEventListener("pagehide", keep);

  urlIn.addEventListener("input", function () { S.f.url = urlIn.value.trim(); changed(); });

  /* design panel */
  function placePanel() { panel.style.top = $("ed-bar").getBoundingClientRect().bottom + "px"; }
  designBtn.addEventListener("click", function () {
    var open = panel.hidden;
    panel.hidden = !open;
    designBtn.setAttribute("aria-expanded", String(open));
    document.body.classList.toggle("ed-open", open);
    if (open) placePanel();
  });
  window.addEventListener("resize", placePanel);
  panel.addEventListener("input", function (e) {
    var key = e.target.dataset && e.target.dataset.d;
    if (!key) return;
    S.d[key] = e.target.value;
    applyDesign();
    if (key === "align") draw();
    changed();
  });
  panel.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.pal) {
      var p = PALETTES[+b.dataset.pal];
      S.d.accent = p[1]; S.d.bg = p[2]; S.d.alt = p[3]; S.d.text = p[4];
    } else if ("reset" in b.dataset) {
      S.d = Object.assign({}, DESIGN);
    } else return;
    applyDesign(); syncPanel(); draw(); changed();
  });

  /* editing on the page */
  app.addEventListener("input", function (e) {
    var el = e.target.closest && e.target.closest("[data-k]");
    if (!el) return;
    var v = el.textContent.replace(/\s*\n\s*/g, " ");
    if (!v.trim()) { v = ""; el.textContent = ""; }
    set(el.dataset.k, v);
    if (el.dataset.k === "brand") {
      var m = app.querySelector('[data-mirror="brand"]');
      if (m) m.textContent = v.trim();
    }
    changed();
  });
  app.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.closest("[data-k]")) { e.preventDefault(); e.target.blur(); }
  });
  app.addEventListener("paste", function (e) {
    if (CE === "plaintext-only" || !e.target.closest("[data-k]")) return;
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData("text").replace(/\s*\n\s*/g, " ");
    document.execCommand("insertText", false, text);
  });
  app.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    var d = b.dataset;
    if (d.img) {
      imgPath = d.img; fileIn.value = ""; fileIn.click();
      return;
    }
    if (d.add) {
      S.l[d.add].push(Object.assign({}, BLANK[d.add]));
      draw(); changed();
      var first = app.querySelector('[data-k^="' + d.add + "." + (S.l[d.add].length - 1) + '."]');
      if (first) first.focus();
      return;
    }
    if (d.rm) { var a = d.rm.split("."); S.l[a[0]].splice(+a[1], 1); }
    else if (d.rmimg) setImg(d.rmimg, "");
    else if (d.ic) { var c = d.ic.split("."), it = S.l[c[0]][+c[1]]; it.ic = d.v; it.img = ""; }
    else if (d.hide) S.sec[d.hide].hide = !S.sec[d.hide].hide;
    else return;
    draw(); changed();
  });
  app.addEventListener("change", function (e) {
    var d = e.target.dataset;
    if (!d || !d.sec) return;
    S.sec[d.sec][d.opt] = e.target.value;
    draw(); changed();
  });
  fileIn.addEventListener("change", function () {
    var file = fileIn.files[0], path = imgPath;
    if (!file || !path) return;
    var photo = path.indexOf("sec.") === 0;           // big section photos become JPEGs;
    var max = photo ? 1600 : 400;                      // logos, icons and faces stay small and keep transparency
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function () {
      var k = Math.min(1, max / Math.max(im.naturalWidth, photo ? 1 : im.naturalHeight)), c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
      var g = c.getContext("2d");
      if (photo) { g.fillStyle = "#ffffff"; g.fillRect(0, 0, c.width, c.height); }
      g.drawImage(im, 0, 0, c.width, c.height);
      setImg(path, photo ? c.toDataURL("image/jpeg", 0.82) : c.toDataURL("image/png"));
      URL.revokeObjectURL(url);
      draw(); changed();
    };
    im.onerror = function () { URL.revokeObjectURL(url); status("That file couldn't be read as an image. Try a JPG or PNG."); };
    im.src = url;
  });

  /* save and download */
  saveBtn.addEventListener("click", function () {
    if (!art || !dirty) return;
    saveBtn.disabled = true;
    status("Saving…");
    var prev = S.rev, id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    S.rev = id;
    kv.set(PENDING, { id: id, s: S }).then(function () { return art.publish(selfDoc()); }).then(function () {
      kv.del(DRAFT);
    }, function (err) {
      var code = err && err.code;
      if (code === "conflict") return; // the page reloads; the pending copy restores these edits
      S.rev = prev;
      kv.del(PENDING);
      if (code === "not_writer" || code === "not_granted") {
        canSave = false; saveBtn.hidden = true;
        status("You can't save changes to this page. Your edits are kept in this browser; use Download website to keep a copy.");
      } else if (code === "too_large") {
        status("Too large to save. Try removing a photo or two.");
      } else if (code === "rate_limited") {
        status("Saving too often. Wait a moment, then press Save again.");
      } else {
        status("Couldn't save. Your edits are still here: try Save again.");
      }
      saveBtn.disabled = false;
    });
  });

  $("ed-dl").addEventListener("click", function () {
    var html = siteDoc();
    if (!(window.claude && window.claude.use)) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
      a.download = "index.html";
      document.body.appendChild(a); a.click(); a.remove();
      return;
    }
    window.claude.use("downloads").then(function (d) {
      if (!d) { status("Downloading isn't available in this view."); return; }
      return d.save({ filename: "index.html", data: html }).then(function () {
        status("Downloaded index.html: that file is your finished website.");
      }, function (err) {
        if (err && err.code === "declined") return status();
        status(err && err.code === "rate_limited" ? "A download prompt is already open." : "Couldn't download in this view.");
      });
    });
  });

  /* start */
  refresh();
  Promise.all([kv.get(PENDING), kv.get(DRAFT)]).then(function (r) {
    var pending = r[0], draft = r[1];
    kv.del(PENDING);
    if (pending && pending.id && pending.id !== baseRev) {
      S = merge(pending.s);
      notice = "Your last save didn't go through. Your edits are still here: press Save again.";
    } else if (draft && draft.base === baseRev) {
      S = merge(draft.s);
    } else {
      // edits made in the first version of this page, which kept them in localStorage
      try {
        var old = JSON.parse(localStorage.getItem("lp-draft") || "null");
        if (!old || baseRev) return;
        S = merge(old.s);
        localStorage.removeItem("lp-draft");
      } catch (e) { return; }
    }
    dirty = true;
    refresh();
  });
  if (window.claude && window.claude.use) {
    window.claude.use("artifact").then(function (a) {
      if (!a) return;
      art = a; canSave = true; saveBtn.hidden = false;
      status(notice);
    });
  }
})();
</script>
