<title>SaaS Site Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="site">
/* The finished website. Everything is scoped to .site so the builder's own screens are untouched.
   Layout: full-width bands, one per section, each choosing its own background from five colour roles. */
.site {
  --c-accent: #2f5d50; --c-accent-text: #ffffff; --c-bg: #fbfaf7; --c-alt: #f1efe9; --c-text: #1d1f1e;
  --c-inv-acc: #8fc7b3; --c-inv-acc-text: #10201b;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-heading: Georgia, "Times New Roman", serif;
  --scale: 1; --h-scale: 1; --h-weight: 700; --radius: 10px; --btn-radius: 10px; --space: 1; --max: 1120px;
  container-type: inline-size; position: relative;
  font-family: var(--font-body); font-size: calc(1.0625rem * var(--scale)); line-height: 1.6;
  background: var(--c-bg); color: var(--c-text); -webkit-font-smoothing: antialiased;
}
body.site { margin: 0; }
.site *, .site *::before, .site *::after { box-sizing: border-box; }
.bgx {
  --muted: color-mix(in srgb, var(--text) 70%, var(--bg));
  --border: color-mix(in srgb, var(--text) 14%, var(--bg));
  --surface: color-mix(in srgb, var(--text) 4%, var(--bg));
  background-color: var(--bg); color: var(--text);
}
.bg-plain { --bg: var(--c-bg); --text: var(--c-text); --accent: var(--c-accent); --accent-text: var(--c-accent-text); }
.bg-tint { --bg: var(--c-alt); --text: var(--c-text); --accent: var(--c-accent); --accent-text: var(--c-accent-text); }
.bg-brand { --bg: var(--c-accent); --text: var(--c-accent-text); --accent: var(--c-accent-text); --accent-text: var(--c-accent); }
.bg-inv { --bg: var(--c-text); --text: var(--c-bg); --accent: var(--c-inv-acc); --accent-text: var(--c-inv-acc-text); }
.bg-photo { --bg: #1b1d1f; --text: #ffffff; --accent: #ffffff; --accent-text: #111111; background-size: cover; background-position: center; }
.bg-photo .card { --surface: rgba(0, 0, 0, 0.35); }

:where(.site) h1, :where(.site) h2, :where(.site) h3 {
  font-family: var(--font-heading); font-weight: var(--h-weight);
  line-height: 1.12; letter-spacing: -0.01em; margin: 0 0 0.75rem; text-wrap: balance;
}
:where(.site) h1 { font-size: calc(clamp(2.25rem, 6vw, 4rem) * var(--h-scale)); font-size: calc(clamp(2.25rem, 6.5cqi, 4rem) * var(--h-scale)); }
:where(.site) h2 { font-size: calc(clamp(1.75rem, 4vw, 2.75rem) * var(--h-scale)); font-size: calc(clamp(1.75rem, 4.2cqi, 2.75rem) * var(--h-scale)); }
:where(.site) h3 { font-size: calc(1.2rem * var(--h-scale)); }
:where(.site) p { margin: 0 0 1rem; }
:where(.site) a { color: var(--accent); }
:where(.site) img { max-width: 100%; display: block; }
:where(.site) ul, :where(.site) ol { margin: 0; padding: 0; list-style: none; }
:where(.site) blockquote { margin: 0; }
.site .ph { opacity: 0.5; font-style: italic; }

.w { max-width: var(--max); margin: 0 auto; padding-inline: max(1.25rem, env(safe-area-inset-left, 0px)) max(1.25rem, env(safe-area-inset-right, 0px)); }
.s { padding-block: calc(clamp(3.5rem, 9cqi, 6.5rem) * var(--space)); }
.s-head { max-width: 46rem; margin-bottom: 2.75rem; }
.s-head:last-child { margin-bottom: 0; }
.al-center .s-head, .al-center .prose, .al-center .hero-txt, .al-center .cta-txt { margin-inline: auto; text-align: center; }
.eb { color: var(--accent); font-size: 0.8em; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.75rem; }
.intro, .lead { color: var(--muted); font-size: 1.12em; }
.prose { max-width: 44rem; }
.muted { color: var(--muted); }
.note { color: var(--muted); font-size: 0.875em; margin: 0.9rem 0 0; }

.btns { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.75rem; }
.al-center .btns, .al-center .sub { justify-content: center; }
.btn {
  display: inline-block; padding: 0.85rem 1.5rem; border: 2px solid var(--accent); border-radius: var(--btn-radius);
  background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; text-decoration: none; cursor: pointer;
}
.btn:hover { opacity: 0.9; }
.btn2 { background: transparent; color: var(--text); border-color: var(--border); }
.sub { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.75rem; }
.sub input {
  flex: 1 1 14rem; max-width: 22rem; min-width: 0; padding: 0.85rem 1rem; font: inherit;
  border: 2px solid var(--border); border-radius: var(--btn-radius); background: var(--bg); color: var(--text);
}
.sub + .btns { margin-top: 0.75rem; }

.grid { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(min(15rem, 100%), 1fr)); }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(21rem, 100%), 1fr)); }
.grid > *, .split > * { min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; }
.card > :last-child { margin-bottom: 0; }
.split { display: grid; gap: clamp(2rem, 5cqi, 4rem); align-items: center; grid-template-columns: repeat(auto-fit, minmax(min(21rem, 100%), 1fr)); }
.split .s-head { margin-bottom: 0; text-align: left; }
.ic {
  display: block; width: 2.75rem; height: 2.75rem; padding: 0.6rem; margin-bottom: 1rem; border-radius: var(--radius);
  background: color-mix(in srgb, var(--accent) 14%, var(--bg)); color: var(--accent);
}
.slot {
  display: grid; place-items: center; width: 100%; aspect-ratio: 16 / 10; padding: 1rem; text-align: center;
  border: 2px dashed var(--border); border-radius: var(--radius); background: var(--surface); color: var(--muted); font-size: 0.9em;
}
.shot { width: 100%; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.45); }

.list li { position: relative; padding: 0.55rem 0 0.55rem 1.9rem; border-top: 1px solid var(--border); }
.list li:last-child { border-bottom: 1px solid var(--border); }
.list li::before { content: ""; position: absolute; left: 0.2rem; top: 1.05em; width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--accent); }
.list.check li::before, .list.cross li::before { width: auto; height: auto; background: none; top: 0.55rem; font-weight: 700; }
.list.check li::before { content: "✓"; color: var(--accent); }
.list.cross li::before { content: "✕"; color: var(--muted); }
.list.plain li { border: 0; padding-block: 0.3rem; }

/* Navigation and announcement */
.ann { padding-block: 0.6rem; text-align: center; font-size: 0.9em; }
.ann a { color: inherit; font-weight: 700; margin-left: 0.5rem; }
.nav { padding-block: 0.9rem; border-bottom: 1px solid var(--border); }
.nav.sticky { position: sticky; top: 0; z-index: 5; }
.nav .w { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.5rem; }
.brand { display: flex; align-items: center; gap: 0.6rem; margin-right: auto; color: var(--text); text-decoration: none; font-family: var(--font-heading); font-weight: 700; font-size: 1.2em; }
.brand img { height: 2rem; width: auto; }
.links { display: flex; flex-wrap: wrap; gap: 0.25rem 1.4rem; }
.links a, .login { color: var(--muted); text-decoration: none; }
.links a:hover, .login:hover { color: var(--text); }
.nav .btn { padding: 0.55rem 1.05rem; }
.nav-center .w { flex-direction: column; }
.nav-center .brand { margin: 0; }
@container (max-width: 720px) { .nav-left .links { order: 3; width: 100%; } }

/* Hero */
.hero { padding-block: calc(clamp(4rem, 11cqi, 8rem) * var(--space)); }
.hero-txt { max-width: 46rem; }
.al-center .hero-txt { max-width: 54rem; }
.hero .lead { font-size: 1.22em; }
.badge { display: inline-block; padding: 0.3rem 0.85rem; margin-bottom: 1.25rem; border: 1px solid var(--border); border-radius: 999px; font-size: 0.85em; font-weight: 600; color: var(--accent); background: var(--surface); }
.rating { margin: 1.25rem 0 0; color: var(--muted); font-size: 0.9em; }
.stars { color: var(--accent); letter-spacing: 0.1em; margin-right: 0.4rem; }
.hero-img { margin-top: clamp(2.5rem, 6cqi, 4rem); }

/* Proof and product */
.logos-h { color: var(--muted); font-size: 0.9em; font-weight: 600; margin-bottom: 1.5rem; }
.logos { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 1.25rem 2.75rem; }
.al-left .logos { justify-content: flex-start; }
.logos span { font-family: var(--font-heading); font-weight: 700; font-size: 1.2em; color: var(--muted); }
.logos img { height: 2.25rem; width: auto; filter: grayscale(1); opacity: 0.75; }
.big { font-family: var(--font-heading); font-weight: var(--h-weight); font-size: clamp(3.5rem, 12cqi, 7rem); line-height: 1; color: var(--accent); margin-bottom: 0.5rem; }
.callout { margin-top: 2rem; padding: 0.2rem 0 0.2rem 1.25rem; border-left: 4px solid var(--accent); font-family: var(--font-heading); font-size: 1.35em; line-height: 1.35; }
.al-center .callout { border-left: 0; padding: 0; }
.ba .after { border: 2px solid var(--accent); }
.flist { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fit, minmax(min(21rem, 100%), 1fr)); }
.flist > div { display: flex; gap: 1rem; align-items: flex-start; min-width: 0; }
.flist .ic { flex: none; margin: 0; }
.flist h3 { margin-bottom: 0.25rem; }
.flist p { color: var(--muted); margin: 0; }
.card p, .steps p { color: var(--muted); }
.card .eb + h3 { margin-top: -0.25rem; }
.more { display: inline-block; margin-top: 0.75rem; font-weight: 600; text-decoration: none; }
.frame { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); box-shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.45); }
.frame::before {
  content: ""; display: block; height: 2.1rem; border-bottom: 1px solid var(--border);
  background: radial-gradient(circle at 1.1rem 50%, #ff5f57 0.3rem, transparent 0.33rem),
              radial-gradient(circle at 2rem 50%, #febc2e 0.3rem, transparent 0.33rem),
              radial-gradient(circle at 2.9rem 50%, #28c840 0.3rem, transparent 0.33rem);
}
.frame .shot, .frame .slot { border: 0; border-radius: 0; box-shadow: none; }
.video { position: relative; display: block; }
.play {
  position: absolute; inset: 0; margin: auto; width: 5rem; height: 5rem; border-radius: 50%;
  background: var(--accent); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}
.play::after { content: ""; position: absolute; left: 2.05rem; top: 1.55rem; border-left: 1.4rem solid var(--accent-text); border-top: 0.95rem solid transparent; border-bottom: 0.95rem solid transparent; }
.cap { color: var(--muted); font-size: 0.9em; text-align: center; margin-top: 1rem; }
.rows { display: grid; gap: clamp(3rem, 8cqi, 6rem); }
.rows .eb { margin-bottom: 0.5rem; }
.rows h3 { font-size: calc(clamp(1.5rem, 3.2cqi, 2.1rem) * var(--h-scale)); }
.rows p { color: var(--muted); }
.rows.alt .split:nth-child(even) > :last-child { order: -1; }
.steps { counter-reset: step; }
.steps li { counter-increment: step; }
.steps li::before {
  content: counter(step); display: grid; place-items: center; width: 2.6rem; height: 2.6rem; margin-bottom: 1rem;
  border-radius: 50%; background: var(--accent); color: var(--accent-text); font-weight: 700;
}
.tl { max-width: 40rem; display: grid; gap: 0; }
.al-center .tl { margin-inline: auto; }
.tl li { position: relative; padding: 0 0 2rem 3.75rem; text-align: left; }
.tl li::before { position: absolute; left: 0; top: 0; margin: 0; }
.tl li:not(:last-child)::after { content: ""; position: absolute; left: 1.25rem; top: 2.9rem; bottom: 0.3rem; width: 2px; background: var(--border); }
.tiles { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(9.5rem, 100%), 1fr)); }
.tile { display: grid; place-items: center; gap: 0.5rem; min-height: 6.5rem; padding: 1rem; text-align: center; font-weight: 600; }
.tile img, .flist .lg { height: 2.5rem; width: auto; }
.flist .lg { flex: none; width: 2.5rem; object-fit: contain; }
.badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; }
.al-left .badges { justify-content: flex-start; }
.badges > * { display: flex; align-items: center; gap: 0.6rem; padding: 0.75rem 1.1rem; border-radius: var(--radius); font-weight: 600; }
.badges .ic { width: 2rem; height: 2rem; padding: 0.35rem; margin: 0; }
.badges img { height: 3.5rem; width: auto; }
.stats { display: grid; gap: 2rem; grid-template-columns: repeat(auto-fit, minmax(min(11rem, 100%), 1fr)); }
.al-center .stats { text-align: center; }
.stats strong { display: block; font-family: var(--font-heading); font-weight: var(--h-weight); font-size: clamp(2.4rem, 6cqi, 3.5rem); line-height: 1.05; color: var(--accent); }
.stats span { display: block; color: var(--muted); margin-top: 0.35rem; }
.quote blockquote { margin-bottom: 1.25rem; }
.who { display: flex; align-items: center; gap: 0.8rem; text-align: left; }
.who strong { display: block; }
.who span { display: block; color: var(--muted); font-size: 0.9em; }
.avatar { width: 3rem; height: 3rem; border-radius: 50%; object-fit: cover; flex: none; }
.slot.avatar { aspect-ratio: 1; padding: 0; font-size: 0.6em; }
.featured { max-width: 50rem; margin-inline: auto; text-align: center; }
.featured blockquote { font-family: var(--font-heading); font-size: clamp(1.4rem, 3.4cqi, 2.1rem); line-height: 1.3; margin-bottom: 1.75rem; }
.featured .who { justify-content: center; }
.cs-stats { display: flex; flex-wrap: wrap; gap: 1.5rem 2.5rem; margin: 1.75rem 0; }
.cs-stats strong { display: block; font-family: var(--font-heading); font-size: 2em; line-height: 1.1; color: var(--accent); }
.cs-stats span { color: var(--muted); font-size: 0.9em; }
.cs-quote { border-left: 4px solid var(--accent); padding-left: 1.25rem; margin-bottom: 1.25rem; font-size: 1.08em; }
.cs-right > :first-child { order: 2; }
.tbl { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
.tbl table { width: 100%; border-collapse: collapse; min-width: 30rem; }
.tbl th, .tbl td { padding: 0.9rem 1.1rem; border-bottom: 1px solid var(--border); text-align: left; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl th { font-size: 0.9em; }
.tbl .us { color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.yes { color: var(--accent); font-weight: 700; }
.no { color: var(--muted); }

/* Conversion */
.billing { text-align: center; color: var(--muted); margin-bottom: 1.75rem; }
.al-left .billing { text-align: left; }
.plans { display: grid; gap: 1.5rem; align-items: start; grid-template-columns: repeat(auto-fit, minmax(min(16rem, 100%), 1fr)); }
.plans.one { max-width: 26rem; margin-inline: auto; }
.al-left .plans.one { margin-inline: 0; }
.plan { position: relative; display: flex; flex-direction: column; text-align: left; }
.plan.pop { border: 2px solid var(--accent); }
.tag { position: absolute; top: -0.8rem; left: 1.5rem; padding: 0.2rem 0.7rem; border-radius: 999px; background: var(--accent); color: var(--accent-text); font-size: 0.75em; font-weight: 700; }
.price { font-family: var(--font-heading); font-weight: var(--h-weight); font-size: 2.6em; line-height: 1.1; margin: 0.25rem 0 1rem; color: var(--text); }
.per { font-family: var(--font-body); font-weight: 400; font-size: 0.38em; color: var(--muted); margin-left: 0.3rem; }
.plan .list { margin-bottom: 1.5rem; }
.plan .btn { display: block; text-align: center; margin-top: auto; }
.al-center .plans + .note { text-align: center; }
.guar { display: flex; flex-wrap: wrap; align-items: center; gap: 1.5rem 2rem; max-width: 50rem; }
.al-center .guar { margin-inline: auto; justify-content: center; text-align: center; }
.guar .ic { width: 4.5rem; height: 4.5rem; padding: 1rem; margin: 0; }
.guar > div { flex: 1 1 20rem; }
.guar p { color: var(--muted); margin: 0; }
.faq { max-width: 50rem; }
.al-center .faq { margin-inline: auto; }
.faq details { border-bottom: 1px solid var(--border); }
.faq details:first-child { border-top: 1px solid var(--border); }
.faq summary { cursor: pointer; padding: 1.1rem 0; font-weight: 600; text-align: left; }
.faq details p { color: var(--muted); text-align: left; }
.faq2 h3 { font-size: calc(1.05rem * var(--h-scale)); margin-bottom: 0.4rem; }
.faq2 p { color: var(--muted); margin: 0; }
.faq-c { margin-top: 2rem; color: var(--muted); }
.al-center .faq-c { text-align: center; }
.cta-txt { max-width: 44rem; }
.portrait { width: 100%; max-width: 22rem; aspect-ratio: 4 / 5; object-fit: cover; border-radius: var(--radius); }
.slot.portrait { aspect-ratio: 4 / 5; }
.sign { margin-top: 1.5rem; }
.sign strong { display: block; font-family: var(--font-heading); font-size: 1.2em; }
.sign span { color: var(--muted); }
.art img, .art .slot { aspect-ratio: 16 / 9; object-fit: cover; width: 100%; border-radius: calc(var(--radius) - 2px); margin-bottom: 1.1rem; }
.art h3 a { color: inherit; text-decoration: none; }
.contact-list { display: grid; gap: 0.6rem; margin-top: 1.25rem; }
.al-center .contact-list { justify-items: center; }
.contact-list a { font-weight: 600; }

/* Footer */
.ft { padding-block: 2.75rem; border-top: 1px solid var(--border); font-size: 0.92em; color: var(--muted); }
.ft .w { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1.25rem 2rem; }
.ft .brand { font-size: 1.1em; margin: 0; }
.ft p { margin: 0; }
.ft-split .w { align-items: flex-start; }
.ft-split .ft-brand { display: grid; gap: 0.6rem; max-width: 24rem; }
.ft-simple .w { justify-content: center; text-align: center; flex-direction: column; }
.ft .links a { color: var(--muted); }
</style>
<style id="ui">

  --b-bg: #f2f3f5; --b-panel: #ffffff; --b-fg: #16181d; --b-dim: #5b6270; --b-line: #dfe2e7;

  }
}

  --b-acc: #3bd1b2; --b-acc-fg: #04221c; --b-soft: #11342d; --b-hl: #fbbf24; --b-ink: #e9ecef; --b-ink-fg: #121417; color-scheme: dark;
}
html, body { height: 100%; }

.site button, .site input { font: inherit; }
#root :focus-visible { outline: 2px solid var(--b-acc); outline-offset: 2px; }
.ui-h1 { font-size: clamp(1.4rem, 3vw, 1.85rem); line-height: 1.2; margin: 0 0 0.5rem; text-wrap: balance; letter-spacing: -0.01em; }

.tickbox { display: grid; place-items: center; width: 1.2rem; height: 1.2rem; border: 1.5px solid var(--b-line); border-radius: 4px; font-size: 0.8rem; font-weight: 800; color: var(--b-acc-fg); }
.opt[aria-checked="true"] .tickbox { background: var(--b-acc); border-color: var(--b-acc); }

    if (!(S.brand.url || "").trim()) out.push(["style", "links", "Brand and style: add your main button link"]);
    S.order.forEach(function (id) {
      var c = BY[id], s = sd(id), n = c.name;
      textEls(c, s).forEach(function (e) {
        if ((e.k === "heading" || e.k === "headline") && !(s.f[e.k] || "").trim()) out.push([id, "text", n + ": write the " + e.label.toLowerCase()]);
      });
      if (itemsOn(c, s) && !IT_final(s, c).length) out.push([id, "items", n + ": add your " + c.items.plural]);
      slots(c, s).forEach(function (sl) { if (!s.img[sl[0]]) out.push([id, "images", n + ": add the " + sl[1].toLowerCase()]); });
    });
    return out;
  }
  function IT_final(s, c) { var keep = PV; PV = false; var r = IT(s, c); PV = keep; return r; }
  function finishHTML() {
    var t = todos();
    return '<div class="finish"><div class="fin-top"><div><p class="kicker">Stage 3 · Finish</p><h1 class="ui-h1">Your homepage is built</h1>' +
      '<p class="why">This is your finished page with ' + S.order.length + " sections. Download it as a single file, <b>index.html</b>, and upload it to any web host " +
      "(for example Netlify Drop, Cloudflare Pages or GitHub Pages) to put it online. You can come back and change anything at any time.</p>" +
      '<div class="row-btns" style="margin-top:0"><button type="button" class="b-btn pri" data-download>Download website</button><button type="button" class="b-btn" data-stage="build">Keep editing</button><button type="button" class="b-btn" data-stage="structure">Change structure</button></div></div>' +
      '<div class="todo"><h2>' + (t.length ? "Still to fill in (" + t.length + ")" : "Everything is filled in") + "</h2>" +
      (t.length ? "<ul>" + t.map(function (x) { return "<li><span>" + esc(x[2]) + '</span><button type="button" class="b-btn sm" data-jump="' + x[0] + ":" + x[1] + '">Fill in</button></li>'; }).join("") + "</ul>"
                : "<p>Every heading, list and image slot has something in it.</p>") +
      (t.length ? '<p style="margin-top:0.6rem">Empty parts are simply left out of the downloaded site.</p>' : "") + "</div></div>" +
      '<div class="fin-pv">' + previewHTML() + "</div></div>";
  }

  /* ---- render ---- */
  function renderStepper() {
    var ok = S.order.length > 0;
    $("stepper").innerHTML = [["structure", "1 Structure"], ["build", "2 Build"], ["finish", "3 Finish"]].map(function (x) {
      return '<button type="button" data-stage="' + x[0] + '"' + (S.stage === x[0] ? ' aria-current="step"' : "") + (x[0] !== "structure" && !ok ? " disabled" : "") + ">" + x[1] + "</button>";
    }).join("");
  }
  function renderPreview() {
    var el = $("pv-site");
    if (!el) return;
    el.style.cssText = vars();
    el.innerHTML = page(true);
    if (S.stage === "build") {
      var cur = el.querySelector('[data-sid="' + S.cur.sid + '"]');
      if (cur) cur.classList.add("b-cur");
    }
  }
  function scrollPreview(force) {
    var sc = $("pv-scroll"), el = $("pv-site");
    if (!sc || !el || S.stage !== "build") return;
    if (!force && lastSid === S.cur.sid) return;
    lastSid = S.cur.sid;
    var target = S.cur.sid === "style" ? null : el.querySelector('[data-sid="' + S.cur.sid + '"]');
    sc.scrollTop = target ? Math.max(0, target.offsetTop - 12) : 0;
  }
  function render(keepFocus) {
    var active = keepFocus && document.activeElement, key = active && active.getAttribute && (active.getAttribute("data-set") || active.getAttribute("data-toggle"));
    var panelTop = $("panel") ? $("panel").scrollTop : 0, pvTop = $("pv-scroll") ? $("pv-scroll").scrollTop : 0, sameSid = lastSid === S.cur.sid;
    renderStepper();
    useFonts("site-fonts", siteFonts());
    main.className = "main" + (S.stage === "build" ? " is-build" : "");
    if (S.stage === "build" && S.order.length) main.innerHTML = buildHTML();
    else if (S.stage === "finish" && S.order.length) main.innerHTML = finishHTML();
    else { S.stage = "structure"; main.innerHTML = structureHTML(); }
    if (S.stage === "build" && S.cur.sid === "style" && /font$/.test(S.cur.did)) useFonts("all-fonts", fontQuery(FONTS.map(function (f) { return f[0]; })));
    renderPreview();
    if (keepFocus && $("panel")) $("panel").scrollTop = panelTop;
    if (keepFocus && sameSid && $("pv-scroll")) $("pv-scroll").scrollTop = pvTop;
    else scrollPreview(true);
    if (key) {
      var again = main.querySelector('[data-set="' + key + '"],[data-toggle="' + key + '"]');
      if (again) again.focus({ preventScroll: true });
    }
    status(notice);
  }
  var pvTimer;
  function previewSoon() { clearTimeout(pvTimer); pvTimer = setTimeout(renderPreview, 120); }

  /* ---- state changes ---- */
  var keepTimer;
  function changed() {
    dirty = true; notice = "";
    status();
    clearTimeout(keepTimer);
    keepTimer = setTimeout(keep, 400);
  }
  function keep() { if (dirty) kv.set("draft", { base: baseRev, s: S }); }
  window.addEventListener("pagehide", keep);
  function status(msg) {
    statusEl.textContent = msg || (dirty ? (canSave ? "Unsaved changes" : "Changes are kept in this browser") : (canSave ? "All changes saved" : ""));
    saveBtn.disabled = !dirty;
  }
  function applyGoal(oldG, newG) {
    var o = CTAS[oldG], n = CTAS[newG];
    if (!n) return;
    ["hero", "nav", "finalcta"].forEach(function (id) {
      var s = S.sec[id];
      if (!s) return;
      if (!s.f.cta || (o && s.f.cta === o[0])) s.f.cta = n[0];
      if (id !== "nav" && (!s.f.cta2 || (o && s.f.cta2 === o[1]))) s.f.cta2 = n[1];
    });
  }
  function step(dir) {
    var list = buildList(), si = list.indexOf(S.cur.sid), ds = decs(S.cur.sid), di = S.cur.di;
    if (dir > 0) S.done[S.cur.sid + ":" + S.cur.did] = 1;
    di += dir;
    if (di >= ds.length) {
      if (si + 1 >= list.length) { S.stage = "finish"; changed(); render(); top(); return; }
      S.cur = { sid: list[si + 1], did: decs(list[si + 1])[0].id, di: 0 };
    } else if (di < 0) {
      if (si === 0) { S.stage = "structure"; S.qstep = QS.length; changed(); render(); return; }
      var prev = decs(list[si - 1]);
      S.cur = { sid: list[si - 1], did: prev[prev.length - 1].id, di: prev.length - 1 };
    } else S.cur = { sid: S.cur.sid, did: ds[di].id, di: di };
    changed(); render();
    var pn = $("panel"); if (pn) pn.scrollTop = 0;
    if (window.innerWidth < 860) window.scrollTo(0, 0);
  }
  function top() { main.scrollTop = 0; if (window.innerWidth < 860) window.scrollTo(0, 0); }
  function go(stage) {
    if (stage !== "structure" && !S.order.length) return;
    S.stage = stage;
    if (stage === "structure" && S.order.length) S.qstep = QS.length;
    changed(); render(); top();
  }

  /* ---- events ---- */
  main.addEventListener("submit", function (e) { e.preventDefault(); });
  main.addEventListener("click", function (e) {
    if (e.target.closest(".site a")) { e.preventDefault(); return; }
    var b = e.target.closest("button");
    if (!b || b.disabled) return;
    var d = b.dataset;
    if (d.q) {
      var old = S.q.goal;
      S.q[d.q] = d.v;
      if (d.q === "goal") applyGoal(old, d.v);
      if (!S.custom || !S.order.length) S.order = recipe(S.q).sug;
      S.qstep += 1;
      changed(); render(); top(); return;
    }
    if (d.qm) {
      var arr = (S.q[d.qm] || []).slice(), at = arr.indexOf(d.v);
      if (at >= 0) arr.splice(at, 1);
      else if (d.v === "none") arr = ["none"];
      else arr = arr.filter(function (x) { return x !== "none"; }).concat([d.v]);
      S.q[d.qm] = arr;
      if (!S.custom || !S.order.length) S.order = recipe(S.q).sug;
      changed(); render(true); return;
    }
    if (d.qstep != null) { S.qstep = +d.qstep; if (S.qstep >= QS.length && !S.order.length) S.order = recipe(S.q).sug; changed(); render(); top(); return; }
    if (d.mv) {
      var m = d.mv.split(":"), i = +m[0], j = i + +m[1], o = S.order.slice(), t = o[i]; o[i] = o[j]; o[j] = t;
      S.order = o; S.custom = true; changed(); render(true); return;
    }
    if (d.toggleOff) { S.order = S.order.filter(function (x) { return x !== d.toggleOff; }); S.custom = true; changed(); render(); return; }
    if ("recipe" in d) { S.order = recipe(S.q).sug; S.custom = false; changed(); render(); return; }
    if ("start" in d) {
      S.stage = "build";
      if (buildList().indexOf(S.cur.sid) < 0) S.cur = { sid: "style", did: "name", di: 0 };
      changed(); render(); top(); return;
    }
    if (d.stage) { go(d.stage); return; }
    if (d.set && d.v != null) {
      setP(d.set, d.v);
      if (d.set.indexOf("sec.") === 0 && /\.layout$/.test(d.set)) fixCur();
      changed(); render(true); return;
    }
    if (d.pal) {
      var p = PALETTES[+d.pal];
      S.d.accent = p[1]; S.d.bg = p[2]; S.d.alt = p[3]; S.d.text = p[4];
      changed(); render(true); return;
    }
    if (d.up) { fileTarget = { path: d.up, kind: d.kind }; var fi = $("file"); fi.value = ""; fi.click(); return; }
    if (d.rmimg) { setP(d.rmimg, ""); changed(); render(true); return; }
    if (d.iadd) {
      var c = BY[d.iadd], s = sd(d.iadd);
      s.items.push(blankItem(c, s.items.length));
      changed(); render(true);
      var pn = $("panel"); if (pn) pn.scrollTop = pn.scrollHeight;
      return;
    }
    if (d.irm) { var a = d.irm.split(":"); sd(a[0]).items.splice(+a[1], 1); changed(); render(true); return; }
    if (d.imv) {
      var q = d.imv.split(":"), arr = sd(q[0]).items, x = +q[1], y = x + +q[2], tmp = arr[x]; arr[x] = arr[y]; arr[y] = tmp;
      changed(); render(true); return;
    }
    if (d.step) { step(+d.step); return; }
    if (d.jump) {
      var jj = d.jump.split(":");
      S.stage = "build";
      S.cur = { sid: jj[0], did: jj[1] || decs(jj[0])[0].id, di: 0 };
      changed(); render(); if (S.stage !== "build" || window.innerWidth < 860) top(); return;
    }
    if ("expand" in d) { expandAll = !expandAll; render(true); return; }
    if (d.pv) { S.pv = d.pv; changed(); render(true); return; }
    if ("download" in d) { download(); return; }
  });
  main.addEventListener("change", function (e) {
    var t = e.target, d = t.dataset;
    if (d.toggle) {
      if (t.checked) { if (S.order.indexOf(d.toggle) < 0) S.order = insertCanon(d.toggle); }
      else S.order = S.order.filter(function (x) { return x !== d.toggle; });
      S.custom = true; changed(); render(true); return;
    }
    if ("jumpsel" in d) { S.cur = { sid: t.value, did: decs(t.value)[0].id, di: 0 }; changed(); render(); return; }
    if (!d.set) return;
    if (t.type === "checkbox") { setP(d.set, t.checked); changed(); render(true); return; }
    if (t.tagName === "SELECT") { setP(d.set, t.value); changed(); if (d.set.indexOf("d.") === 0) render(true); else previewSoon(); }
  });
  main.addEventListener("input", function (e) {
    var t = e.target, d = t.dataset;
    if (!d.set || t.type === "checkbox" || t.tagName === "SELECT") return;
    setP(d.set, t.value);
    changed();
    if (d.set === "d.radius") { var o = $("rad-out"); if (o) o.textContent = t.value + "px"; }
    previewSoon();
  });
  // Insert a newly ticked section where it naturally belongs, keeping the user's own ordering of the rest.
  function insertCanon(id) {
    var o = S.order.slice(), ci = CANON.indexOf(id), at = o.length;
    for (var k = 0; k < o.length; k++) { if (CANON.indexOf(o[k]) > ci) { at = k; break; } }
    o.splice(at, 0, id);
    return o;
  }
  $("tb").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (b && b.dataset.stage && !b.disabled) go(b.dataset.stage);
  });

  /* ---- images: shrink in the browser before storing ---- */
  $("file").addEventListener("change", function () {
    var file = this.files[0], tgt = fileTarget;
    if (!file || !tgt) return;
    var photo = tgt.kind === "photo", max = photo ? 1600 : 480;
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function () {
      var k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight)), cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(im.naturalWidth * k)); cv.height = Math.max(1, Math.round(im.naturalHeight * k));
      var g = cv.getContext("2d");
      if (photo) { g.fillStyle = "#ffffff"; g.fillRect(0, 0, cv.width, cv.height); }
      g.drawImage(im, 0, 0, cv.width, cv.height);
      setP(tgt.path, photo ? cv.toDataURL("image/jpeg", 0.82) : cv.toDataURL("image/png"));
      URL.revokeObjectURL(url);
      changed(); render(true);
    };
    im.onerror = function () { URL.revokeObjectURL(url); status("That file couldn't be read as an image. Try a JPG or PNG."); };
    im.src = url;
  });

  /* =====================================================================
     9. OUTPUT: the finished website, and saving this builder
     ===================================================================== */
  var END = "<" + "/script>";
  function siteDoc() {
    var c = sd("hero"), name = nm(), hl = (c.f.headline || "").trim(), sub = (c.f.sub || "").trim(), f = siteFonts();
    var title = name && hl ? name + " · " + hl : name || hl || "Home";
    return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>' + esc(title) + "</title>\n" +
      (sub ? '<meta name="description" content="' + esc(sub) + '">\n' : "") +
      (f ? '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="' + esc(f) + '">\n' : "") +
      "<style>\nhtml{scroll-behavior:smooth}\n" + $("site").textContent + "</style>\n</head>\n" +
      '<body class="site" id="top" style="' + esc(vars()) + '">\n' + page(false) +
      '\n<script>document.querySelectorAll(".yr").forEach(function(e){e.textContent=new Date().getFullYear()});' + END + "\n</body>\n</html>\n";
  }
  function selfDoc() {
    var reset = (document.head.querySelector("style") || {}).textContent || "";
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + "</style></head><body>" +
      "<title>" + TITLE + '</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' +
      '<style id="site">' + $("site").textContent + '</style>\n<style id="ui">' + $("ui").textContent + "</style>\n" +
      '<div id="root"></div>\n<script type="application/json" id="state">' + JSON.stringify(S).replace(/</g, "\\u003c") + END +
      '\n<script id="main">' + $("main").textContent + END + "\n</body></html>";
  }
  saveBtn.addEventListener("click", function () {
    if (!art || !dirty) return;
    saveBtn.disabled = true;
    status("Saving…");
    var prev = S.rev, id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    S.rev = id;
    kv.set("pending", { id: id, s: S }).then(function () { return art.publish(selfDoc()); }).then(function () {
      kv.del("draft");
    }, function (err) {
      var code = err && err.code;
      if (code === "conflict") return;
      S.rev = prev;
      kv.del("pending");
      if (code === "not_writer" || code === "not_granted") {
        canSave = false; saveBtn.hidden = true;
        status("You can't save changes to this page. Your work is kept in this browser; use Download website to keep a copy.");
      } else if (code === "too_large") status("Too large to save. Try removing a few photos.");
      else if (code === "rate_limited") status("Saving too often. Wait a moment, then press Save again.");
      else status("Couldn't save. Your work is still here: try Save again.");
      saveBtn.disabled = false;
    });
  });
  function download() {
    if (!S.order.length) { status("Choose your sections first."); return; }
    var html = siteDoc();
    if (!(window.claude && window.claude.use)) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
      a.download = "index.html";
      document.body.appendChild(a); a.click(); a.remove();
      return;
    }
    window.claude.use("downloads").then(function (d) {
      if (!d) { status("Downloading isn't available in this view."); return; }
      return d.save({ filename: "index.html", data: html }).then(function () {
        status("Downloaded index.html: that file is your website.");
      }, function (err) {
        if (err && err.code === "declined") return status();
        status(err && err.code === "rate_limited" ? "A download prompt is already open." : "Couldn't download in this view.");
      });
    });
  }
  $("dl").addEventListener("click", download);

  /* ---- start ---- */
  render();
  Promise.all([kv.get("pending"), kv.get("draft")]).then(function (r) {
    var pending = r[0], draft = r[1];
    kv.del("pending");
    if (pending && pending.id && pending.id !== baseRev) {
      S = merge(pending.s);
      notice = "Your last save didn't go through. Your work is still here: press Save again.";
    } else if (draft && draft.base === baseRev) S = merge(draft.s);
    else return;
    dirty = true;
    render();
  });
  if (window.claude && window.claude.use) {
    window.claude.use("artifact").then(function (a) {
      if (!a) return;
      art = a; canSave = true; saveBtn.hidden = false;
      status(notice);
    });
  }
})();
</script>
