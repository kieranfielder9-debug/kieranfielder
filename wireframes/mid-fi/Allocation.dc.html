<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:#F4F4F5; --surface:#FFFFFF; --border:#D4D4D8; --border-strong:#A1A1AA;
      --ink:#18181B; --ink-soft:#3F3F46; --muted:#71717A;
      --fill:#27272A; --fill-text:#FAFAFA; --track:#E4E4E7; --track-fill:#52525B;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
    a{color:inherit;text-decoration:none;}
    button{font-family:inherit;cursor:pointer;}
    .t2{font-size:17px;font-weight:700;color:var(--ink);margin:0;}
    .t3{font-size:11px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--ink-soft);margin:0;}
    .t3-val{font-size:15px;font-weight:700;color:var(--ink);margin:0;}
    .t4{font-size:12px;font-weight:400;color:var(--muted);margin:0;line-height:1.4;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;}
    .btn-outline{background:transparent;color:var(--ink);border:1px solid var(--border-strong);border-radius:20px;padding:10px 14px;font-size:12px;font-weight:600;white-space:nowrap;}
    .cross-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--surface);border:1px solid var(--border-strong);border-radius:16px;font-size:11px;font-weight:600;color:var(--ink-soft);padding:10px 4px;}
    .cross-btn.primary{background:var(--fill);border-color:var(--fill);color:var(--fill-text);}
    .vault-row{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--surface);width:100%;text-align:left;}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 6px;font-size:10px;}
    .icon-btn{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;padding:0;}
  </style>
</helmet>
<div style="width:390px;height:1400px;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;">

  <div style="flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--border);">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;">
      <button aria-label="Go back" style="background:none;border:none;padding:4px;display:flex;align-items:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#18181B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="t3" style="letter-spacing:0.1em;">ALLOCATION</div>
      <div style="display:flex;align-items:center;gap:10px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#18181B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        <div aria-hidden="true" style="width:22px;height:22px;border-radius:50%;background:var(--track);border:1px solid var(--border-strong);"></div>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-around;padding:2px 24px 12px;">
      <button aria-label="Identity &amp; Values" class="icon-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3F3F46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M4.5 20c0-4.2 3.4-6.5 7.5-6.5s7.5 2.3 7.5 6.5"/></svg>
      </button>
      <button aria-label="Card" class="icon-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3F3F46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>
      </button>
      <button aria-label="Watchtower" class="icon-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3F3F46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20V13M21 20H3"/></svg>
      </button>
      <button aria-label="Objectives" class="icon-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3F3F46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12l3 3 6-6"/></svg>
      </button>
    </div>
  </div>

  <div style="flex:1 1 auto;padding:16px;display:flex;flex-direction:column;gap:16px;overflow:hidden;">

    <div class="t2">Portfolio &amp; Allocation Strategy</div>

    <div class="card" style="display:flex;flex-direction:column;gap:6px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <div class="t3">Stream Splitter</div>
        <div class="t4">£6,000 total</div>
      </div>
      <svg width="100%" height="320" viewBox="0 0 350 340" preserveAspectRatio="xMidYMid meet">
        <path d="M175,8 C168,55 182,95 175,130" fill="none" stroke="#94A3B8" stroke-width="34" stroke-linecap="round"/>
        <path d="M175,130 C140,170 80,165 55,215 C32,250 45,285 28,315" fill="none" stroke="#64748B" stroke-width="30" stroke-linecap="round"/>
        <path d="M175,130 C182,175 163,225 175,262 C184,285 170,300 175,315" fill="none" stroke="#94A3B8" stroke-width="25" stroke-linecap="round"/>
        <path d="M175,130 C210,170 270,165 295,215 C318,250 305,285 322,315" fill="none" stroke="#CBD5E1" stroke-width="18" stroke-linecap="round"/>
        <path d="M175,8 C168,55 182,95 175,130" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
        <path d="M175,130 C140,170 80,165 55,215 C32,250 45,285 28,315" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6" stroke-linecap="round"/>
        <path d="M175,130 C182,175 163,225 175,262 C184,285 170,300 175,315" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5" stroke-linecap="round"/>
        <path d="M175,130 C210,170 270,165 295,215 C318,250 305,285 322,315" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <div style="display:flex;justify-content:space-between;gap:6px;padding-top:2px;">
        <div style="flex:1;text-align:left;">
          <div class="t4" style="color:var(--ink-soft);font-weight:600;">Gold Vault</div>
          <div class="t4">£2,400 · 40%</div>
        </div>
        <div style="flex:1;text-align:center;">
          <div class="t4" style="color:var(--ink-soft);font-weight:600;">Wellspring</div>
          <div class="t4">£1,800 · 30%</div>
        </div>
        <div style="flex:1;text-align:right;">
          <div class="t4" style="color:var(--ink-soft);font-weight:600;">Kingdom Fund</div>
          <div class="t4">£1,200 · 20%</div>
        </div>
      </div>
    </div>

    <button class="card" style="display:flex;align-items:center;justify-content:space-between;text-align:left;border-color:var(--border-strong);">
      <div>
        <div class="t3">Unallocated Funds</div>
        <div class="t4">Not yet assigned to a stream</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="t3-val">£600.00</div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </button>

    <div style="display:flex;flex-direction:column;gap:8px;">
      <div class="t3" style="align-self:center;">Quick Give &amp; Move</div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,72px);gap:8px;">
        <div></div>
        <button class="cross-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3F3F46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v5h5"/><path d="M20 20v-5h-5"/><path d="M4.5 9a8 8 0 0114.5-3.5"/><path d="M19.5 15a8 8 0 01-14.5 3.5"/></svg>
          Automate
        </button>
        <div></div>
        <button class="cross-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3F3F46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v9H4v-9"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7C9 7 8 3.5 10 2.3 11.6 1.4 12 4 12 7z"/><path d="M12 7c3 0 4-3.5 2-4.7C12.4 1.4 12 4 12 7z"/></svg>
          Tithes
        </button>
        <div></div>
        <button class="cross-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3F3F46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7"/><path d="M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/></svg>
          Offerings
        </button>
        <div></div>
        <button class="cross-btn primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FAFAFA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          Transfer
        </button>
        <div></div>
      </div>
    </div>

    <div class="card" style="display:flex;flex-direction:column;gap:10px;">
      <div class="t3">Vaults</div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <button class="vault-row">
          <span style="width:36px;height:36px;border-radius:10px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex:0 0 auto;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3F3F46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="12" r="3.5"/><path d="M12 10.5v0.01"/></svg>
          </span>
          <span style="flex:1;">
            <div class="t4" style="color:var(--ink-soft);font-weight:700;">Emergency Fund</div>
            <div class="t4">10% Auto-Split</div>
          </span>
          <span style="text-align:right;">
            <div class="t3-val">£1,800.00</div>
          </span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button class="vault-row">
          <span style="width:36px;height:36px;border-radius:10px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex:0 0 auto;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3F3F46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="12" r="3.5"/><path d="M12 10.5v0.01"/></svg>
          </span>
          <span style="flex:1;">
            <div class="t4" style="color:var(--ink-soft);font-weight:700;">Wellspring Fund</div>
            <div class="t4">5% Auto-Split</div>
          </span>
          <span style="text-align:right;">
            <div class="t3-val">£900.00</div>
          </span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button class="vault-row">
          <span style="width:36px;height:36px;border-radius:10px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex:0 0 auto;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3F3F46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="12" r="3.5"/><path d="M12 10.5v0.01"/></svg>
          </span>
          <span style="flex:1;">
            <div class="t4" style="color:var(--ink-soft);font-weight:700;">Gold Vault</div>
            <div class="t4">Manual</div>
          </span>
          <span style="text-align:right;">
            <div class="t3-val">£2,400.00</div>
          </span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
      <button class="btn-outline" style="align-self:stretch;">+ Create New Allocation Rule</button>
    </div>

  </div>

  <div style="position:relative;display:flex;align-items:flex-end;justify-content:space-around;border-top:1px solid var(--border);background:var(--surface);padding:8px 4px 14px;flex:0 0 auto;">
    <a href="Watchtower.dc.html" class="nav-item" style="color:var(--muted);font-weight:500;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20V13M21 20H3"/></svg>
      Watchtower
    </a>
    <a href="Planning.dc.html" class="nav-item" style="color:var(--muted);font-weight:500;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Planning
    </a>
    <a href="Home.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:2px;transform:translateY(-16px);">
      <span style="width:52px;height:52px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,0.25);border:3px solid var(--surface);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FAFAFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
      </span>
      <span style="font-size:10px;font-weight:700;color:var(--ink);">Home</span>
    </a>
    <a href="Allocation.dc.html" class="nav-item" style="color:var(--ink);font-weight:700;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l7 4"/></svg>
      Alloc
    </a>
    <a href="Measurement.dc.html" class="nav-item" style="color:var(--muted);font-weight:500;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
      Measure
    </a>
  </div>

</div>
</x-dc>

  }

</body>
</html>
