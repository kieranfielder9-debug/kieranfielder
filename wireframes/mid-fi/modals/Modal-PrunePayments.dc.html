<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:#F4F4F5; --surface:#FFFFFF; --border:#D4D4D8; --border-strong:#A1A1AA;
      --ink:#18181B; --ink-soft:#3F3F46; --muted:#71717A;
      --fill:#27272A; --fill-text:#FAFAFA; --track:#E4E4E7; --track-fill:#52525B;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;}
    a{color:inherit;text-decoration:none;}
    button{font-family:inherit;cursor:pointer;}
    .t2{font-size:17px;font-weight:700;color:var(--ink);margin:0;}
    .t4{font-size:12px;font-weight:400;color:var(--muted);margin:0;}
    .row{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
    .btn-primary{background:var(--fill);color:var(--fill-text);border:none;border-radius:20px;padding:12px 14px;font-size:13px;font-weight:600;width:100%;}
  </style>
</helmet>
<div style="width:390px;height:640px;position:relative;background:rgba(24,24,27,0.45);overflow:hidden;">
  <div style="padding:18px;">
    <a href="Watchtower.dc.html" style="color:#FAFAFA;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FAFAFA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      Close
    </a>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 18px 30px;box-shadow:0 -10px 30px rgba(0,0,0,0.25);display:flex;flex-direction:column;gap:14px;">
    <div style="width:36px;height:4px;border-radius:2px;background:var(--border-strong);align-self:center;"></div>
    <div class="t2">Prune Payments</div>
    <div class="t4">Select which flagged payments to cancel</div>

    <label class="row">
      <input type="checkbox" checked style="width:16px;height:16px;">
      <span style="flex:1;font-size:13px;font-weight:600;color:var(--ink-soft);">Streaming Subscription</span>
      <span class="t4" style="font-weight:600;">£9.99/mo</span>
    </label>
    <label class="row">
      <input type="checkbox" checked style="width:16px;height:16px;">
      <span style="flex:1;font-size:13px;font-weight:600;color:var(--ink-soft);">Unused Gym Membership</span>
      <span class="t4" style="font-weight:600;">£24.99/mo</span>
    </label>
    <label class="row">
      <input type="checkbox" style="width:16px;height:16px;">
      <span style="flex:1;font-size:13px;font-weight:600;color:var(--ink-soft);">Duplicate Insurance</span>
      <span class="t4" style="font-weight:600;">£15.00/mo</span>
    </label>

    <button class="btn-primary">Cancel Selected (2) — Save £34.98/mo</button>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
